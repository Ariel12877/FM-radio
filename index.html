<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Radio AR" />
  <meta name="description" content="Radios de Argentina en vivo. Skin retro exacto." />
  <link rel="manifest" href="manifest.json?v=100" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=100" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=100" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=100" />
  <link rel="shortcut icon" href="favicon.ico?v=100" />
  <script>
    (function () {
      var mq = window.matchMedia("(min-width: 900px)");
      function go() {
        if (mq.matches && !/[?&]vista=movil/.test(location.search)) location.replace("pc.html" + location.hash);
      }
      go();
      if (mq.addEventListener) mq.addEventListener("change", go);
    })();
  </script>
  <title>Radio Argentina</title>
  <link rel="stylesheet" href="styles.css?v=100" />
</head>
<body>
  <div class="app" id="app">

    <!-- Fondo exacto de la fotografía -->
    <div class="radio-body" id="radioBody">
      <img class="skin-img" src="radio-skin.webp" alt="" draggable="false" />

      <!-- Aguja del dial (roja, se mueve) -->
      <div class="needle-wrap" id="needleWrap" aria-hidden="true">
        <i class="needle" id="needle"></i>
      </div>

      <!-- Overlay del LCD: cubre el texto original y pone el dinámico -->
      <div class="lcd-overlay" id="lcdOverlay">
        <div class="lcd-inner">
          <div class="lcd-logo" aria-hidden="true">
            <!-- El logo R con micrófono queda visible del skin; este es solo espacio -->
          </div>
          <div class="lcd-text">
            <div class="lcd-name" id="stationName">Radio Nacional</div>
            <div class="lcd-slogan" id="lcdSlogan">Siempre junto a vos</div>
          </div>
          <div class="lcd-eq" id="visualizer" aria-hidden="true">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
            <span class="bar"></span><span class="bar"></span>
          </div>
        </div>
      </div>

      <!-- Frecuencia pequeña (opcional, sobre el dial o LCD) -->
      <div class="freq-badge" id="freq">—</div>

      <!-- Hotspots de controles (transparentes, encima de los botones del skin) -->
      <button class="hotspot hs-band" id="bandSelector" title="Cambiar banda" aria-label="Selector de banda"></button>
      <button class="hotspot hs-vol" id="volArea" title="Volumen" aria-label="Volumen"></button>
      <button class="hotspot hs-m" id="btnM" title="Menú / Memoria" aria-label="M"></button>
      <button class="hotspot hs-prev" id="btnPrev" title="Anterior" aria-label="Emisora anterior"></button>
      <button class="hotspot hs-next" id="btnNext" title="Siguiente" aria-label="Emisora siguiente"></button>
      <button class="hotspot hs-play" id="btnPlay" title="Play / Pause" aria-label="Reproducir o pausar"></button>

      <!-- Bottom navigation hotspots -->
      <nav class="bottom-nav" aria-label="Navegación">
        <button class="nav-btn active" data-tab="radios" id="tabRadios" aria-label="Radios">
          <span class="nav-hit"></span>
        </button>
        <button class="nav-btn" data-tab="fav" id="tabFav" aria-label="Favoritas">
          <span class="nav-hit"></span>
        </button>
        <button class="nav-btn" data-tab="recent" id="tabRecent" aria-label="Recientes">
          <span class="nav-hit"></span>
        </button>
        <button class="nav-btn" data-tab="settings" id="tabSettings" aria-label="Ajustes">
          <span class="nav-hit"></span>
        </button>
        <button class="nav-btn" data-tab="about" id="tabAbout" aria-label="Acerca de">
          <span class="nav-hit"></span>
        </button>
      </nav>

      <!-- Área táctil grande sobre el parlante / display para abrir lista -->
      <button class="hotspot hs-speaker" id="openListBtn" title="Ver emisoras" aria-label="Ver lista de radios"></button>
    </div>

    <!-- Panel de lista de emisoras (se abre sobre el radio) -->
    <div class="list-panel" id="listPanel" hidden>
      <div class="list-header">
        <button class="list-close" id="listClose" aria-label="Cerrar">✕</button>
        <h2>Emisoras</h2>
        <div class="list-search-wrap">
          <input type="search" id="stationSearch" class="list-search" placeholder="Buscar emisora..." autocomplete="off" />
        </div>
        <div class="list-filters">
          <button class="filter-chip active" data-filter="all">Todas</button>
          <button class="filter-chip" data-filter="fav">★ Favoritas</button>
          <button class="filter-chip" data-filter="chaco">📍 Chaco</button>
        </div>
      </div>
      <div class="station-list" id="stationList">
        <!-- filled by JS -->
      </div>
    </div>

    <!-- Panel Favoritas / Recientes / Ajustes / Acerca (simples) -->
    <div class="side-panel" id="sidePanel" hidden>
      <div class="side-header">
        <button class="list-close" id="sideClose" aria-label="Cerrar">✕</button>
        <h2 id="sideTitle">Favoritas</h2>
      </div>
      <div class="side-body" id="sideBody"></div>
    </div>

    <!-- Elementos ocultos que el JS espera -->
    <button id="btnFav" style="display:none" aria-hidden="true"></button>
    <button id="btnEq" style="display:none" aria-hidden="true"></button>
    <div id="connText" style="display:none"></div>
    <div id="bitrate" style="display:none"></div>
    <div id="liveTimer" style="display:none"></div>
    <div id="eqPanel" style="display:none"></div>
    <div id="eqClose" style="display:none"></div>
    <audio id="player" crossorigin="anonymous" preload="none"></audio>
  </div>

  <script src="stations.js?v=100"></script>
  <script src="logos.js?v=100"></script>
  <script src="app.js?v=100"></script>
</body>
</html>
